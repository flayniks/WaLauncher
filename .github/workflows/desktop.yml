name: Build desktop app

on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
    paths: ['src/**', 'electron/**', 'tools/**', 'build/**', 'package.json', 'package-lock.json', '.github/workflows/desktop.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Clipwave-Windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
